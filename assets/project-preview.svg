<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">Explanatory illustration: shared virtual war-room</title>
  <desc id="desc">Schematic, not a screenshot or research result. Two participants wearing Oculus Rift headsets each control an avatar in one shared virtual room around a planning table. A legacy Unity networking host synchronizes avatar motion and voice between participants.</desc>
  <rect x="0" y="0" width="720" height="420" rx="14" fill="#f6f7f9"/>

  <!-- shared virtual room -->
  <rect x="190" y="46" width="340" height="250" rx="12" fill="#e7edf5" stroke="#5b7290" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="360" y="72" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4560">Shared virtual war-room</text>
  <!-- planning table -->
  <ellipse cx="360" cy="185" rx="92" ry="42" fill="#c9d4e2" stroke="#5b7290" stroke-width="1.5"/>
  <path d="M310 180 l20 -12 l18 10 l22 -14 l26 16 l18 -8" fill="none" stroke="#5b7290" stroke-width="1.5"/>
  <text x="360" y="208" text-anchor="middle" font-size="11" fill="#2f4560">planning table</text>
  <!-- avatars -->
  <g fill="#2f6f9f">
    <circle cx="246" cy="160" r="11"/><rect x="236" y="173" width="20" height="30" rx="8"/>
    <circle cx="474" cy="160" r="11"/><rect x="464" y="173" width="20" height="30" rx="8"/>
  </g>
  <text x="360" y="276" text-anchor="middle" font-size="12" fill="#2f4560">synchronized avatars (one per participant)</text>

  <!-- participants -->
  <g font-size="12" fill="#333" text-anchor="middle">
    <g transform="translate(80,150)">
      <circle cx="0" cy="0" r="18" fill="#ffffff" stroke="#333" stroke-width="2"/>
      <rect x="-17" y="-8" width="34" height="13" rx="4" fill="#333"/>
      <path d="M-24 50 q24 -36 48 0" fill="#ffffff" stroke="#333" stroke-width="2"/>
      <text x="0" y="72">Participant A</text>
      <text x="0" y="88" fill="#666" font-size="11">Oculus Rift</text>
    </g>
    <g transform="translate(640,150)">
      <circle cx="0" cy="0" r="18" fill="#ffffff" stroke="#333" stroke-width="2"/>
      <rect x="-17" y="-8" width="34" height="13" rx="4" fill="#333"/>
      <path d="M-24 50 q24 -36 48 0" fill="#ffffff" stroke="#333" stroke-width="2"/>
      <text x="0" y="72">Participant B</text>
      <text x="0" y="88" fill="#666" font-size="11">Oculus Rift</text>
    </g>
  </g>

  <!-- links participants to room -->
  <g stroke="#2f6f9f" stroke-width="2" fill="none">
    <path d="M110 160 C150 160 190 160 232 165" marker-end="url(#arr)" marker-start="url(#arr)"/>
    <path d="M610 160 C570 160 530 160 488 165" marker-end="url(#arr)" marker-start="url(#arr)"/>
  </g>
  <g font-size="11" fill="#2f6f9f" text-anchor="middle">
    <text x="160" y="140">motion + voice</text>
    <text x="560" y="140">motion + voice</text>
  </g>

  <!-- network host -->
  <rect x="270" y="318" width="180" height="40" rx="8" fill="#ffffff" stroke="#5b7290" stroke-width="1.5"/>
  <text x="360" y="336" text-anchor="middle" font-size="12" fill="#2f4560">network host</text>
  <text x="360" y="351" text-anchor="middle" font-size="10.5" fill="#666">legacy Unity networking</text>
  <line x1="360" y1="296" x2="360" y2="318" stroke="#5b7290" stroke-width="1.5"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f6f9f"/>
    </marker>
  </defs>

  <text x="360" y="396" text-anchor="middle" font-size="12" font-style="italic" fill="#8a2f2f">Explanatory illustration only. Not a screenshot, recording or research result.</text>
</svg>
